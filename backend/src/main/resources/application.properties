spring.application.name=backend

# Definizione principale letta dal driver Spring Boot MongoDB
spring.mongodb.uri=${MONGODB_URI}

# Configurazione Spring Data MongoDB che eredita il valore
spring.data.mongodb.uri=${spring.mongodb.uri}

# Usa la variabile d'ambiente JWT_SECRET, altrimenti fallisce l'avvio se non definita
quicksketch.app.jwtSecret=${JWT_SECRET}
quicksketch.app.jwtExpirationMs=900000
quicksketch.app.jwtCookieName=quicksketch_jwt