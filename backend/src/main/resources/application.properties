spring.application.name=quicksketch-backend
server.port=${PORT:8080}

# Connessione MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Log utili per verificare le query eseguite su MongoDB
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Parametri custom JWT
quicksketch.app.jwtSecret=${JWT_SECRET}
quicksketch.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}