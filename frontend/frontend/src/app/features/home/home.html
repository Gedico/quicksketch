<div class="home-container">
  <header class="hero">
    <h1>Benvenuto su Quick<span class="accent">Sketch</span></h1>
    <p>Disegna, indovina e condividi le tue creazioni con la community.</p>
    
    <div class="hero-actions" *ngIf="!authService.isLoggedIn()">
      <a routerLink="/register" class="btn btn-primary">Crea un Account</a>
      <a routerLink="/login" class="btn btn-secondary">Accedi</a>
    </div>

    <div class="hero-actions" *ngIf="authService.isLoggedIn()">
      <p class="welcome-msg">Sei autenticato! Pronto a giocare?</p>
    </div>
  </header>

  <section class="sketch-placeholder-section">
    <h3>🖼️ Galleria Sketch in arrivo</h3>
    <div class="placeholder-box">
      <p>Qui verranno mostrati gli sketch della community non appena collegheremo la galleria.</p>
    </div>
  </section>
</div>
