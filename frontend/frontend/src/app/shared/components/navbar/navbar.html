<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/" class="brand-logo">
      Quick<span>Sketch</span>
    </a>
  </div>

  <div class="navbar-links">
    <!-- Link sempre visibili a tutti -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
      Home
    </a>

    <a routerLink="/leaderboard" routerLinkActive="active" class="nav-link">
      Classifica
    </a>

    <!-- Link riservati agli utenti autenticati -->
    <ng-container *ngIf="authService.isAuthenticatedSignal(); else guestLinks">
      <a routerLink="/create" routerLinkActive="active" class="nav-link">
        Crea Sketch
      </a>

      <a routerLink="/profile" routerLinkActive="active" class="nav-link">
        Statistiche
      </a>

      <button type="button" (click)="onLogout()" class="btn-logout">
        Esci
      </button>
    </ng-container>

    <!-- Link per utenti non autenticati -->
    <ng-template #guestLinks>
      <a routerLink="/login" routerLinkActive="active" class="nav-link">
        Accedi
      </a>
      <a routerLink="/register" routerLinkActive="active" class="btn-register">
        Registrati
      </a>
    </ng-template>
  </div>
</nav>
