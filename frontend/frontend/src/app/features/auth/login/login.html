<div style="max-width: 360px; margin: 80px auto; font-family: sans-serif; padding: 24px; border: 1px solid #ddd; border-radius: 8px;">
  <h2 style="margin-top: 0;">QuickSketch Login</h2>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 14px;">
      <label style="display: block; margin-bottom: 4px; font-weight: bold;">Username</label>
      <input type="text" [(ngModel)]="credentials.username" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 4px; font-weight: bold;">Password</label>
      <input type="password" [(ngModel)]="credentials.password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">
      Accedi
    </button>
  </form>

  <p *ngIf="successMessage" style="color: green; margin-top: 16px; font-size: 0.9rem;">{{ successMessage }}</p>
  <p *ngIf="errorMessage" style="color: red; margin-top: 16px; font-size: 0.9rem;">{{ errorMessage }}</p>
</div>
