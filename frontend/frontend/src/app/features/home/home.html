<div class="home-container">
  <div class="home-header">
    <div>
      <h1>Galleria degli Sketch</h1>
      <p class="subtitle">Esplora tutti i disegni realizzati dalla community</p>
    </div>

    <!-- Pulsante creazione visibile se autenticato (adatta la condizione al tuo segnale/metodo di auth) -->
    <a *ngIf="authService.isAuthenticatedSignal()" routerLink="/create" class="btn-create-sketch">
      + Crea Sketch
    </a>
  </div>

  <div *ngIf="isLoading" class="status-box">
    Caricamento sketch in corso...
  </div>

  <div *ngIf="errorMessage" class="error-box">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && sketches.length === 0" class="status-box">
    Nessuno sketch ancora presente. Sii il primo a disegnarne uno!
  </div>

  <!-- Griglia pubblica di tutti gli sketch completati -->
  <div *ngIf="!isLoading && sketches.length > 0" class="sketches-grid">
    <div *ngFor="let sketch of sketches" class="sketch-card">
      <div class="image-wrapper">
        <img [src]="sketch.imageData" [alt]="'Sketch di ' + sketch.authorUsername" />
      </div>

      <div class="card-footer">
        <span class="author">Disegnato da <strong>{{ sketch.authorUsername }}</strong></span>
        <span class="date">{{ sketch.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
    </div>
  </div>
</div>
